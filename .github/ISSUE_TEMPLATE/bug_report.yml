name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Remove tokens and private paths from logs before posting.
        Security problems go through **Security → Report a vulnerability**, not here.
  - type: input
    id: package
    attributes:
      label: Package version
      placeholder: "0.19.1 (Window → Package Manager)"
    validations:
      required: true
  - type: input
    id: unity
    attributes:
      label: Unity version and render pipeline
      placeholder: "6000.3.5f2, URP"
    validations:
      required: true
  - type: input
    id: broker
    attributes:
      label: Broker version
      placeholder: "0.19.1 (GET http://127.0.0.1:8765/health)"
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: "Claude Code 2.1.x, Codex, ..."
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
      description: The tool call (name and arguments) and its full answer help most.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Unity Console, and for broker mode `GET http://127.0.0.1:8765/health` plus `%LOCALAPPDATA%\UnityMcp\Broker\logs\broker.log` / `supervisor.log`."
      render: text
