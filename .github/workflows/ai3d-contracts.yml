name: AI 3D contracts

on:
  push:
    paths:
      - "Editor/AI3D/**"
      - "TripoGateway~/**"
      - "Documentation~/tripo-ai-integration-spec.md"
      - "Tools~/**"
      - ".github/workflows/ai3d-contracts.yml"
  pull_request:
    paths:
      - "Editor/AI3D/**"
      - "TripoGateway~/**"
      - "Documentation~/tripo-ai-integration-spec.md"
      - "Tools~/**"
      - ".github/workflows/ai3d-contracts.yml"

permissions:
  contents: read

jobs:
  gateway-and-release-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "TripoGateway~/requirements-dev.txt"
      - name: Install pinned gateway dependencies
        run: python -m pip install -r 'TripoGateway~/requirements-dev.txt'
      - name: Gateway tests (no provider credits)
        run: python -m pytest 'TripoGateway~/tests' -q
      - name: Package release contract
        run: python 'Tools~/validate_release.py'
      - name: Asset Modeler static contract
        run: python 'Tools~/validate_modeling_phase0.py'
